<body class="home">

<!-- ============ 상단 내비게이션 ============ -->

<section class="section">
  <p class="lane-tag">LANE 03</p>
  <h2>패키지·인쇄물<span class="dot">.</span></h2>
  <p class="section-desc">패키지, 리플렛, 쇼핑백, 스티커 등 인쇄 작업물</p>

  <!--
    [갤러리 사용법]
    카드의 data-images 에 보여줄 이미지를 쉼표로 나열하면
    카드를 눌렀을 때 차례로 넘겨볼 수 있어요. 예:
    data-images="assets/banner-01.jpg, assets/banner-02.jpg, assets/banner-03.jpg"
    세로로 긴 상세페이지 이미지도 갤러리 안에서 스크롤되니 그대로 넣으면 됩니다.
  -->
  <div class="work-grid">
    <a class="work-card" href="#" data-images="assets/momora/package.png">
      <div class="thumb"><img src="assets/momora/package.png" alt="" onerror="this.parentElement.classList.add('empty')" /></div>
      <h3>제품 패키지</h3>
      <p>카페 모모라 원두 봉투 디자인 · 발주</p>
    </a>
    <a class="work-card" href="#" data-images="assets/momora/리플렛.png">
      <div class="thumb"><img src="assets/momora/리플렛.png" alt="" onerror="this.parentElement.classList.add('empty')" /></div>
      <h3>리플렛</h3>
      <p>3단 접지 리플렛 디자인</p>
    </a>
    <a class="work-card" href="#" data-images="assets/momora/paperbag.png, assets/momora/card.jpg, assets/momora/leonio.png">
      <div class="thumb"><img src="assets/momora/paperbag.png" alt="" onerror="this.parentElement.classList.add('empty')" /></div>
      <h3>쇼핑백 · 카드 · 스티커</h3>
      <p>브랜드 굿즈 일러스트 및 제작</p>
    </a>
  </div>
</section>
